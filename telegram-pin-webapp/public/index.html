<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Telegram Pin Manager</title>
    <link rel="stylesheet" href="/app/styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Менеджер закреплённых сообщений</h1>
      </header>
      <main>
        <section id="create-section">
          <input id="title-input" placeholder="Заголовок сообщения" />
          <button id="create-btn">Создать сообщение</button>
        </section>
        <section id="list-section">
          <h2>Мои сообщения бота в этом чате</h2>
          <div id="messages-list"></div>
        </section>
      </main>
    </div>
    <script src="/app/app.js"></script>
  </body>
  </html>
